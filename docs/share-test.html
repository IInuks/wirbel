<!doctype html>
<html lang="de">
<meta charset="utf-8">
<title>wirbel Screenshare</title>
<style>
  html, body { margin: 0; height: 100%; background: #123; color: #fff; font: 22px sans-serif; }
  button { font: inherit; padding: 12px 24px; margin: 12px; }
  #info { display: inline-block; margin: 12px; }
  video { display: block; width: 100%; max-height: 80vh; background: #000; }
</style>
<button id="go">Teilen starten</button>
<span id="info">Noch nichts geteilt.</span>
<video id="video" autoplay muted></video>
<script>
  const video = document.getElementById("video"), info = document.getElementById("info");
  let frames = 0, last = "";
  function say(text) { info.textContent = text; if (text !== last) console.log("SHARE " + text); last = text; }
  function count() { frames++; say(`${video.videoWidth} x ${video.videoHeight}`); info.textContent += `, Bild ${frames}`;
    if (frames % 30 === 1) console.log(`SHARE frame ${frames}`); video.requestVideoFrameCallback(count); }
  async function start() {
    try {
      const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
      video.srcObject = stream;
      video.requestVideoFrameCallback(count);
      say("Stream steht, warte auf Bilder");
      stream.getVideoTracks()[0].onended = () => say(`Stream beendet nach ${frames} Bildern`);
    } catch (err) { say(`Fehler: ${err.name}: ${err.message}`); }
  }
  document.getElementById("go").onclick = start;
  if (location.search.includes("auto")) start();
</script>
</html>
