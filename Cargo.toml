[package]
name = "wirbel"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Minimal Wayland compositor with a dwindle layout"

[lib]
path = "src/lib.rs"

[[bin]]
name = "wirbel"
path = "src/main.rs"

[features]
# The headless test harness (`wirbel::test_harness`) for the tests of wirbel and of programs that
# build on it: a compositor on its own thread, a Wayland test client, rendering with pixman.
test-harness = [
    "smithay/renderer_pixman",
    "dep:rustix",
    "dep:wayland-client",
    "dep:wayland-protocols",
    "dep:wayland-protocols-wlr",
    "dep:x11rb",
]

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
xcursor = "0.3"
rustix = { version = "1", features = ["pipe"], optional = true }
wayland-client = { version = "0.31", optional = true }
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"], optional = true }
wayland-protocols-wlr = { version = "0.3", features = ["client"], optional = true }
x11rb = { version = "0.14", optional = true }

# Pinned to git: the DRM/multi-GPU work of later stages needs fixes that are not in 0.7.0.
[dependencies.smithay]
git = "https://github.com/Smithay/smithay"
rev = "65aa86fa5236e41775c313408102a5d5c2d1e2ca"
default-features = false
features = [
    "backend_drm",
    "backend_gbm",
    "backend_libinput",
    "backend_session_libseat",
    "backend_udev",
    "backend_winit",
    "desktop",
    "renderer_multi",
    "wayland_frontend",
    "xwayland",
]

# Only the connector scanner: libdisplay-info differs between the strata, Arch 0.3, Void 0.2.
[dependencies.smithay-drm-extras]
git = "https://github.com/Smithay/smithay"
rev = "65aa86fa5236e41775c313408102a5d5c2d1e2ca"
default-features = false

# Everyday build is release. The debug build stays usable on a real screen: GL and the damage
# tracking in Smithay are far too slow without optimisation.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = "line-tables-only"

[dev-dependencies]
# The tests use the harness of this very crate.
wirbel = { path = ".", features = ["test-harness"] }
rustix = { version = "1", features = ["pipe"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
x11rb = "0.14"

[dev-dependencies.smithay]
git = "https://github.com/Smithay/smithay"
rev = "65aa86fa5236e41775c313408102a5d5c2d1e2ca"
default-features = false
features = ["renderer_pixman"]
