# wirbel configuration. Copy this file to ~/.config/wirbel/config and change what you like.
#
# Format: one `name = value` per line, `#` starts a comment line. Options you leave out keep the
# value shown here. As soon as the file contains one `bind`, it replaces all binds below, likewise
# for `mousebind`. Without any `quit` bind, Super+M is added so that you can always get out.

# Layout
gap_outer = 10
gap_inner = 5
border_width = 4

# Colours: 0xRRGGBB or 0xRRGGBBAA
border_color = 0x444444
focus_color = 0xc9b890
background_color = 0x201b14

# Keyboard, as understood by xkbcommon. Delay in milliseconds, rate in keys per second.
keyboard_layout = de
keyboard_variant =
keyboard_options =
repeat_delay = 600
repeat_rate = 25

# Focus follows the pointer.
sloppy_focus = 1
# Keyboard focus changes move the pointer into the window if it is elsewhere.
warp_cursor = 1

# Cursor drawn by wirbel on a VT. Empty theme: XCURSOR_THEME, then `default`. Size: XCURSOR_SIZE,
# then 24. Nested, the host draws it.
# cursor_theme = Adwaita
# cursor_size = 24

# The GPU that renders, by card name as shown by `wirbel check`. Default: the boot GPU.
# render_gpu = card1

# Mode and place of an output, read when it appears. All fields but the name are optional, there is
# no limit on the number of rules. Without a rule: the preferred size at its highest refresh rate,
# right of the other outputs. A rule that cannot be met is logged and the default applies.
# monitorrule = name:DP-4,width:2560,height:1440,refresh:165,scale:1,x:0,y:0
# monitorrule = name:DP-3,width:2560,height:1440,refresh:165

# bind = MODIFIERS, KEY, ACTION, ARGUMENT
# Modifiers: SUPER, CTRL, ALT, SHIFT joined with +, or NONE.
# Keys: xkb key names as shown by wev. Shifted keys are named by their unshifted symbol as well,
# so SUPER+SHIFT, 1 works on every layout.
#
# Actions:
#   spawn COMMAND                run a shell command
#   close                        ask the focused window to close
#   quit                         leave wirbel
#   reload                       read this file again
#   focus left|right|up|down     move the focus
#   focus_next, focus_prev       cycle through the windows of the workspace
#   swap left|right|up|down      exchange the focused tile with its neighbour
#   split_ratio +0.05            grow (+) or shrink (-) the focused tile
#   float                        toggle floating
#   fullscreen                   toggle fullscreen
#   maximize                     toggle maximize: fills the output inside the outer gap
#   workspace 1-9|prev|next      show a workspace of the current output
#   move_to_workspace 1-9        send the focused window there and follow it
#   focus_output DIRECTION       go to the next output
#   move_to_output DIRECTION     send the focused window to the next output and follow it

bind = SUPER, r, reload
bind = SUPER, m, quit
bind = SUPER, Return, spawn, kitty
bind = ALT, q, close
bind = SUPER, w, close

bind = SUPER, Tab, focus_next
bind = ALT, Left, focus, left
bind = ALT, Right, focus, right
bind = ALT, Up, focus, up
bind = ALT, Down, focus, down

bind = SUPER+SHIFT, Left, swap, left
bind = SUPER+SHIFT, Right, swap, right
bind = SUPER+SHIFT, Up, swap, up
bind = SUPER+SHIFT, Down, swap, down

bind = CTRL+ALT, Right, split_ratio, +0.05
bind = CTRL+ALT, Up, split_ratio, +0.05
bind = CTRL+ALT, Left, split_ratio, -0.05
bind = CTRL+ALT, Down, split_ratio, -0.05

# On a German keyboard the backslash needs AltGr, so the key is bound by its plain symbol too.
bind = ALT, backslash, float
bind = ALT, ssharp, float
bind = ALT, a, maximize
bind = ALT, f, fullscreen

bind = SUPER, Left, workspace, prev
bind = SUPER, Right, workspace, next
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER+SHIFT, 1, move_to_workspace, 1
bind = SUPER+SHIFT, 2, move_to_workspace, 2
bind = SUPER+SHIFT, 3, move_to_workspace, 3
bind = SUPER+SHIFT, 4, move_to_workspace, 4
bind = SUPER+SHIFT, 5, move_to_workspace, 5
bind = SUPER+SHIFT, 6, move_to_workspace, 6
bind = SUPER+SHIFT, 7, move_to_workspace, 7
bind = SUPER+SHIFT, 8, move_to_workspace, 8
bind = SUPER+SHIFT, 9, move_to_workspace, 9

bind = ALT+SHIFT, Left, focus_output, left
bind = ALT+SHIFT, Right, focus_output, right
bind = SUPER+ALT, Left, move_to_output, left
bind = SUPER+ALT, Right, move_to_output, right

# mousebind = MODIFIERS, btn_left|btn_right|btn_middle, move|resize
# On a floating window these move and resize it. On a tile, move swaps it with the tile it is
# dropped on, or sends it to the output it is dropped on, and resize drags the dividers.
mousebind = SUPER, btn_left, move
mousebind = SUPER, btn_right, resize
